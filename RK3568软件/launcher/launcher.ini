[launcher]
runmode = script
order = cruise,intersection,nav,surround
background = assets/home_background.png

[cruise]
title = 巡航
description = 车道拟合 · 车辆检测\n暗处增强与车道提示
color = #6940c9
video = videos/巡航.mp4
script = scripts/start_cruise.sh
env = ADAS_HUD_MODE=cruise
input = device
args = --lane-mode adaptive --preprocess cpu

[surround]
title = 环视
description = 上方三路后视 · 下方前视\n同车四视角预拼接
color = #157d91
video = videos/环视.mp4
script = scripts/start_surround.sh
env = ADAS_HUD_MODE=surround
input = device
args = --lane-mode adaptive --preprocess cpu --quad-composite --quad-layout rear-quarter

[intersection]
title = 路口
description = 信号灯面板 · 行人检测\n保留红灯及行人报警
color = #b16926
video = videos/路口.mp4
script = scripts/start_intersection.sh
env = ADAS_HUD_MODE=intersection
input = device
args = --lane-mode adaptive --preprocess cpu

[nav]
title = 导航
description = 导航界面解析 · 路线提示\n左侧导航与右侧道路复合输入
color = #4b6c9c
video = videos/导航.mp4
script = scripts/start_nav.sh
env = ADAS_HUD_MODE=nav
input = device
args = --lane-mode adaptive --preprocess cpu

